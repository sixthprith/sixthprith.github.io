name: Build embeddings

# Whenever the knowledge base changes, re-embed it and commit the result,
# so the map and the chatbot never run on stale vectors.
on:
  push:
    branches: [main]
    paths:
      - knowledge.json
      - tools/embed.mjs
      - .github/workflows/embed.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the embedding library
        run: npm install --no-save --no-package-lock @huggingface/transformers@3.8.1
      - name: Embed the knowledge base
        run: node tools/embed.mjs
      - name: Commit embeddings.json if it changed
        run: |
          git config user.name "embeddings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add embeddings.json
          git diff --cached --quiet || (git commit -m "Rebuild embeddings" && git push)
